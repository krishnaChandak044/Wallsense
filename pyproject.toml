[project]
name = "wallsense"
version = "0.1.0"
description = "Evidence-grounded Wi-Fi CSI research replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "h5py>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
wallsense = "wallsense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallsense"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
